server:
  port: 80

spring:
  mvc:
    view:
      prefix: /views/
      suffix: .jsp

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 40MB

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/port_db
    username: port_user
    password: 123456

mybatis:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: "port-project-jwt-secret-key-must-be-long-enough-2026"
  expiration-ms: 3600000

ai:
  plate:
    url: http://127.0.0.1:8000/api/plate-recognition

kakao:
  message:
    enabled: ${KAKAO_MESSAGE_ENABLED:false}
    dry-run: ${KAKAO_MESSAGE_DRY_RUN:true}
    access-token: ${KAKAO_ACCESS_TOKEN:}
    allowed-user-id: ${KAKAO_ALLOWED_USER_ID:}
    dashboard-url: ${KAKAO_DASHBOARD_URL:http://localhost:5173}
